services:
  postgres:
    # pgvector/pgvector:pg16 is a drop-in Postgres 16 image with the pgvector extension
    # available (not auto-enabled) - same data directory format as postgres:16-alpine, so
    # existing volumes keep working. Needed for EmbeddingSearchProvider.
    image: pgvector/pgvector:pg16
    container_name: document-ai-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-document_ai}
      POSTGRES_USER: ${DB_USERNAME:-document_ai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-document_ai}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-document_ai} -d ${DB_NAME:-document_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: document-ai-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@document-ai-platform.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: document-ai-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_NAME: ${DB_NAME:-document_ai}
      DB_USERNAME: ${DB_USERNAME:-document_ai}
      DB_PASSWORD: ${DB_PASSWORD:-document_ai}
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set - generate with 'openssl rand -base64 48'}"
      # R2 is only required for document upload/download; auth, search, and MCP tooling work
      # without it, so these are NOT hard-required at container startup like JWT_SECRET is.
      R2_ENDPOINT: ${R2_ENDPOINT:-https://placeholder.r2.cloudflarestorage.com}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-placeholder}
      R2_SECRET_KEY: ${R2_SECRET_KEY:-placeholder}
      R2_BUCKET: ${R2_BUCKET:-document-ai-platform}
      R2_REGION: ${R2_REGION:-auto}
      # 'r2' (default, needs the R2_* vars above) or 'local' (LocalFileStorageProvider - stores
      # uploads on the local_storage_data volume instead, no bucket/credentials needed).
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-r2}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/local-storage}
      LOCAL_STORAGE_PUBLIC_BASE_URL: ${LOCAL_STORAGE_PUBLIC_BASE_URL:-http://localhost:8080}
      TESSERACT_LANG: ${TESSERACT_LANG:-eng}
      FTS_LANGUAGE: ${FTS_LANGUAGE:-simple}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-keyword}
      ANSWER_PROVIDER: ${ANSWER_PROVIDER:-claude}
      ANSWER_READ_TIMEOUT_SECONDS: ${ANSWER_READ_TIMEOUT_SECONDS:-120}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-6}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_EMBEDDING_MODEL: ${VOYAGE_EMBEDDING_MODEL:-voyage-3.5}
      VOYAGE_BASE_URL: ${VOYAGE_BASE_URL:-https://api.voyageai.com/v1}
      # 1024, not 1536: Voyage's output_dimension only accepts {256,512,1024,2048}; Gemini/OpenAI
      # both truncate to whatever this is set to, so 1024 works for all three fallback vendors.
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      # 'fallback' (Gemini->OpenAI->Voyage, default) or 'e5' (local multilingual-e5-small via the
      # embeddings service below). Only takes effect when SEARCH_PROVIDER=embedding.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fallback}
      # Only relevant when EMBEDDING_PROVIDER=fallback. chain-enabled=false pins to exactly
      # EMBEDDING_PRIMARY_VENDOR with no cross-vendor substitution on failure - for deployments
      # that want deterministic, fail-loud behavior instead of silent fallback.
      EMBEDDING_CHAIN_ENABLED: ${EMBEDDING_CHAIN_ENABLED:-true}
      EMBEDDING_PRIMARY_VENDOR: ${EMBEDDING_PRIMARY_VENDOR:-gemini}
      E5_BASE_URL: ${E5_BASE_URL:-http://embeddings:80}
      E5_MODEL: ${E5_MODEL:-intfloat/multilingual-e5-small}
      RERANKER_ENABLED: ${RERANKER_ENABLED:-false}
      RERANKER_BASE_URL: ${RERANKER_BASE_URL:-http://reranker:80}
      RERANKER_CANDIDATE_POOL_MULTIPLIER: ${RERANKER_CANDIDATE_POOL_MULTIPLIER:-3}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      # Only actually used when STORAGE_PROVIDER=local; harmless (empty, unmounted-by-app) otherwise.
      - local_storage_data:/app/local-storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  embeddings:
    # Hugging Face Text Embeddings Inference, serving multilingual-e5-small locally over an
    # OpenAI-compatible /v1/embeddings route. Only reached by the backend container over the
    # compose network (E5_BASE_URL above), so no host port is published.
    # Pinned past cpu-1.5, which has a known "relative URL without a base" model-download bug
    # (https://github.com/huggingface/text-embeddings-inference/issues/527), fixed in 1.6.1/1.7.0.
    #
    # profiles: only starts when the 'e5' profile is active (COMPOSE_PROFILES=e5 in .env, or
    # `docker compose --profile e5 up`) - pointless to run this alongside EMBEDDING_PROVIDER=fallback,
    # which never calls it, especially on a resource-constrained (2 vCPU/4GB) deployment.
    profiles: ["e5"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    container_name: document-ai-embeddings
    # auto-truncate: multilingual-e5-small has a hard 512-token limit (BERT-style position
    # embeddings), but document_chunks are chunked to 400-700 *words*, which can exceed 512
    # *tokens* - without this flag TEI 413s on longer chunks instead of truncating them.
    command: ["--model-id", "intfloat/multilingual-e5-small", "--auto-truncate"]
    volumes:
      - e5_model_cache:/data
    restart: unless-stopped

  reranker:
    # Cross-encoder reranking over the embedding search candidates, to counter e5-small's narrow
    # cosine-similarity range (observed 0.81-0.84 for both relevant and irrelevant Turkish chunks in
    # the same workspace). mmarco-mMiniLMv2-L12-H384-v1 (~117M params) chosen over heavier options
    # like bge-reranker-v2-m3 (~568M) to fit this deployment's 4GB RAM budget - see the embedding
    # subsystem plan for the full tradeoff. Disabled by default (RERANKER_ENABLED=false) until
    # empirically validated for latency/quality on this hardware.
    #
    # profiles: only starts when the 'reranker' profile is active (COMPOSE_PROFILES=reranker in
    # .env, or `docker compose --profile reranker up`) - keep this out of RERANKER_ENABLED=false
    # deployments entirely rather than running an idle container.
    profiles: ["reranker"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    container_name: document-ai-reranker
    # auto-truncate: same 512-token BERT-style limit as the embeddings service - document_chunks
    # (400-700 words) can exceed that in tokens, so truncate instead of 413ing.
    command: ["--model-id", "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1", "--auto-truncate"]
    volumes:
      - reranker_model_cache:/data
    restart: unless-stopped

  ollama:
    # Local Qwen (or any other Ollama model) for testing ANSWER_PROVIDER=openai against a local
    # model instead of Claude/OpenAI - point OPENAI_BASE_URL at http://ollama:11434/v1 and set
    # OPENAI_MODEL to whatever tag you've pulled (e.g. qwen2.5:1.5b). No models ship by default;
    # after first `docker compose --profile ollama up -d ollama`, pull one with
    # `docker exec document-ai-ollama ollama pull qwen2.5:1.5b` - cached in ollama_data afterward.
    #
    # profiles: only starts when the 'ollama' profile is active (COMPOSE_PROFILES=ollama in .env,
    # or `docker compose --profile ollama up`).
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: document-ai-ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Runs in the user's browser on the host, not inside the compose network - must be
        # reachable from there, so it points at the published backend port, not a service name.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: document-ai-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  e5_model_cache:
  reranker_model_cache:
  ollama_data:
  local_storage_data:
