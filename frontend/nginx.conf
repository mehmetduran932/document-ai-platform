server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxies same-origin /api and /mcp calls to the backend container over the shared Docker
    # network. Inert in local dev (VITE_API_BASE_URL is built absolute there, so the browser talks
    # to the backend's published port directly and never hits these paths) - this is what makes
    # a prod build (VITE_API_BASE_URL="") work behind a single public domain/TLS cert, since
    # only this frontend container needs to be reachable from the outside.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    location /mcp {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
