server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS (127.0.0.11) with a short TTL, plus $backend_upstream as a variable in
    # proxy_pass below, forces nginx to re-resolve "backend" periodically instead of caching its
    # IP forever - a plain `proxy_pass http://backend:8080` only resolves once at startup/reload,
    # so recreating the backend container alone (e.g. after a config/env change) leaves this
    # nginx pointing at a now-dead IP until the frontend container itself is also restarted.
    resolver 127.0.0.11 valid=10s;

    # Proxies same-origin /api and /mcp calls to the backend container over the shared Docker
    # network. Inert in local dev (VITE_API_BASE_URL is built absolute there, so the browser talks
    # to the backend's published port directly and never hits these paths) - this is what makes
    # a prod build (VITE_API_BASE_URL="") work behind a single public domain/TLS cert, since
    # only this frontend container needs to be reachable from the outside.
    location /api/ {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        # POST /api/ask can take a while (LLM generation on a small CPU-only model/box) - nginx's
        # default 60s read timeout was cutting it off with a 504 before the backend finished.
        # Matches the outer central-nginx proxy's timeout for this site (see
        # /opt/apps/reverse-proxy/conf.d/opendocs.mehmetduranyazilim.online.conf on the target
        # server) - the shortest timeout in the chain wins, so both must agree.
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }

    location /mcp {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
