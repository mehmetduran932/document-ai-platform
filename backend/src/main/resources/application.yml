spring:
  application:
    name: document-ai-platform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/document_ai}
    username: ${DB_USERNAME:document_ai}
    password: ${DB_PASSWORD:document_ai}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    placeholders:
      ftsLanguage: ${app.processing.fts-language:simple}

  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:100MB}
      max-request-size: ${MAX_UPLOAD_SIZE:100MB}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-minimum-256-bits-long-please}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MIN:60}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}

  # Which StorageProvider bean is active. 'r2' (default) is R2StorageProvider (AWS S3 SDK v2 -
  # works unchanged against real AWS S3 or a self-hosted MinIO too, not just Cloudflare R2).
  # 'local' is LocalFileStorageProvider, a filesystem-backed store for local dev so you don't need
  # a real bucket just to try the app - see the 'local' section below and README. Mutually
  # exclusive; only one StorageProvider bean exists at a time.
  storage-provider: ${STORAGE_PROVIDER:r2}

  storage:
    # To switch R2 -> AWS S3   : drop 'endpoint' (or set it to the regional AWS endpoint), real region.
    # To switch R2 -> MinIO    : point 'endpoint' at your MinIO host (e.g. http://minio:9000).
    # No code change either way; StorageProvider is the only seam that matters. Only read when
    # storage-provider=r2.
    r2:
      endpoint: ${R2_ENDPOINT:}
      access-key: ${R2_ACCESS_KEY:}
      secret-key: ${R2_SECRET_KEY:}
      bucket: ${R2_BUCKET:document-ai-platform}
      region: ${R2_REGION:auto}
    # Only read when storage-provider=local. base-path should be a mounted volume (see
    # docker-compose.yml's 'local_storage_data' volume) so files survive container recreation.
    # public-base-url must be reachable by whoever calls presignedDownloadUrl()'s result (the
    # browser locally, or an MCP agent) - defaults to the same host:port the backend itself
    # listens on.
    local:
      base-path: ${LOCAL_STORAGE_PATH:/app/local-storage}
      public-base-url: ${LOCAL_STORAGE_PUBLIC_BASE_URL:http://localhost:8080}

  processing:
    chunk-min-words: 400
    chunk-max-words: 700
    chunk-overlap-words: 50
    tesseract-data-path: ${TESSDATA_PREFIX:/usr/share/tesseract-ocr/5/tessdata}
    tesseract-language: ${TESSERACT_LANG:eng}
    # Postgres text-search regconfig. 'simple' is language-neutral (no stemming) and safe as a
    # default for mixed-language (e.g. Turkish + English) corpora. Set to 'turkish' or 'english'
    # if your workspace's documents are reliably in one language for better ranking via stemming.
    # This same value drives both the document-side tsvector trigger (V1 migration, via Flyway
    # placeholder) and the query-side plainto_tsquery() call in KeywordSearchProvider - they must
    # always match or ranking silently breaks.
    fts-language: ${FTS_LANGUAGE:simple}

  search:
    max-results: 8
    max-answer-chunks: ${MAX_ANSWER_CHUNKS:3}
    content-preview-chars: ${CONTENT_PREVIEW_CHARS:300}

  mcp:
    enabled: ${MCP_ENABLED:true}
    # Off by default: the MCP layer stays read-only (agents synthesize their own answers from
    # search_documents' chunks) unless a deployment explicitly wants a server-side ask_documents
    # tool too (same AnswerProvider/LLM as POST /api/ask). A per-deployment choice, not a default.
    answer-tool-enabled: ${MCP_ANSWER_TOOL_ENABLED:false}

  # SearchProvider selection. 'keyword' (Postgres FTS, default) or 'embedding' (pgvector +
  # semantic matching - required for e.g. "poliçe tutarı" to find "prim tutarı"). Swapping is a
  # config change only; nothing above SearchProvider knows which one is active.
  search-provider: ${SEARCH_PROVIDER:keyword}

  # Which EmbeddingProvider bean is active when search-provider=embedding. 'fallback' (default) is
  # FallbackEmbeddingProvider (Gemini -> OpenAI -> Voyage, in that order); 'e5' is
  # E5EmbeddingProvider, a locally-hosted intfloat/multilingual-e5-small instance (e.g. via Hugging
  # Face TEI). These are mutually exclusive - e5's vector space is not compatible with the fallback
  # trio's, so only one provider bean exists at a time.
  embedding-provider: ${EMBEDDING_PROVIDER:fallback}

  # dimensions must match the pgvector column width. Only read by the gemini/openai/voyage clients
  # for their own truncation logic - e5's 384-dim output isn't truncatable, so E5EmbeddingProvider
  # never references this value. Default is 1024, not 1536, because Voyage's output_dimension only
  # accepts {256, 512, 1024, 2048} - Gemini and OpenAI both truncate to an arbitrary size just fine,
  # so 1024 is the value all three fallback-chain vendors can produce. Changing this (or switching
  # provider) requires a new Flyway migration to resize document_chunks.embedding to match.
  embedding:
    dimensions: ${EMBEDDING_DIMENSIONS:1024}
    # Only relevant when embedding-provider=fallback. chain-enabled=false makes
    # FallbackEmbeddingProvider call only primary-vendor, with no cross-vendor substitution on
    # failure - for deployments that want deterministic, fail-loud behavior.
    chain-enabled: ${EMBEDDING_CHAIN_ENABLED:true}
    primary-vendor: ${EMBEDDING_PRIMARY_VENDOR:gemini}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    voyage:
      api-key: ${VOYAGE_API_KEY:}
      model: ${VOYAGE_EMBEDDING_MODEL:voyage-3.5}
      base-url: ${VOYAGE_BASE_URL:https://api.voyageai.com/v1}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      base-url: ${OPENAI_EMBEDDING_BASE_URL:https://api.openai.com/v1}
    e5:
      base-url: ${E5_BASE_URL:http://embeddings:80}
      model: ${E5_MODEL:intfloat/multilingual-e5-small}

  # Cross-encoder reranking of EmbeddingSearchProvider's candidates (off by default - see the
  # embedding subsystem plan for why: the smallest TEI-compatible multilingual reranker that fits
  # this deployment's RAM budget isn't confirmed-trained on Turkish, so validate quality/latency on
  # real data before enabling in production).
  reranker:
    enabled: ${RERANKER_ENABLED:false}
    base-url: ${RERANKER_BASE_URL:http://reranker:80}
    candidate-pool-multiplier: ${RERANKER_CANDIDATE_POOL_MULTIPLIER:3}

  # AnswerProvider selection for POST /api/ask. 'claude' or 'openai'. The OpenAI client also works
  # against any OpenAI-API-compatible local model server (Ollama, LM Studio, vLLM) - just point
  # openai.base-url at it and set this to 'openai'.
  answer-provider: ${ANSWER_PROVIDER:claude}

  answer:
    # How long to wait for a full completion before giving up (surfaces as a 502 to the caller).
    # Cloud APIs rarely need more than the 120s default; a small local model on CPU-only hardware
    # can legitimately take longer for longer/broader questions - raise this to match if you're
    # seeing 502s with "I/O error ... POST ... /chat/completions: null" in the backend logs.
    read-timeout-seconds: ${ANSWER_READ_TIMEOUT_SECONDS:120}

  claude:
    api-key: ${CLAUDE_API_KEY:}
    model: ${CLAUDE_MODEL:claude-sonnet-4-6}
    max-tokens: ${CLAUDE_MAX_TOKENS:4000}
    api-version: ${CLAUDE_API_VERSION:2023-06-01}
    base-url: ${CLAUDE_BASE_URL:https://api.anthropic.com}

  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.4}
    max-tokens: ${OPENAI_MAX_TOKENS:4000}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.documentai.platform: DEBUG
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
